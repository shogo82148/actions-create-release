name: reviewdog
on: [pull_request]
jobs:
  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: install dependencies
        run: |
          npm ci
      - uses: reviewdog/action-eslint@v1.36.1
        with:
          reporter: github-pr-review
          eslint_flags: "**/*.ts"
